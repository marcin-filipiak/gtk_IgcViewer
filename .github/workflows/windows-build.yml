name: Build Windows

on:
  push:
    branches: ["main"]

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: sudo apt update && sudo apt install -y mingw-w64

      - name: Build Windows binary
        run: |
          x86_64-w64-mingw32-g++ src/IgcViewer.cpp -o IgcViewer.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IgcViewer-windows
          path: IgcViewer.exe
